name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unittest
        run: python -m unittest discover tests

      - name: Lint addons
        run: python tools/lint_addon.py --cross --no-verify

      - name: CHANGELOG vs tools/
        env:
          CHECK_CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_changelog_tools.py
